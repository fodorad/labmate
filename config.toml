# labmate configuration. Paths are relative to the repo root.
# LABMATE_OLLAMA_HOST overrides [ollama].host (e.g. Ollama on another machine).

[ollama]
host = "http://localhost:11434"
timeout_s = 900

[models]
# Model roles. Tags must match `ollama list`.
text = "gemma4:26b-mlx"   # writer: 16.7 GB, a mixture of experts with ~4B active parameters
critic = "gemma4:e4b"     # judge: 6.6 GB
embed = "embeddinggemma:latest"  # ask: chunk and query embeddings

# Model profiles: `labmate --profile NAME ...` (or LABMATE_PROFILE=NAME) swaps the writer and the judge.
# `make bench` compares them. The sizes are what Ollama lists; the GPU can use about 26 GB of this Mac's
# 32 GB, and only what is not used by other programs counts, so the pair has to be well below that.
[profiles.mixed]          # the default, 23 GB together
text = "gemma4:26b-mlx"
critic = "gemma4:e4b"

[profiles.gemma-26b]      # one model for both roles, 16.7 GB
text = "gemma4:26b-mlx"
critic = "gemma4:26b-mlx"

[profiles.fast]           # smaller judge, 21 GB together
text = "gemma4:26b-mlx"
critic = "gemma4:e2b"

[profiles.small]          # one small model for both roles, 6.6 GB
text = "gemma4:e4b"
critic = "gemma4:e4b"

[profiles.qwen]           # fallback writer if the gemma writer is not good enough, 24.6 GB together
text = "qwen3.8:27b-mlx"
critic = "gemma4:e4b"

[generation]
temperature = 0.0
seed = 42
num_ctx = 16384  # Ollama's default window would silently truncate the paper

[pipeline]
workers = 2  # concurrent calls for parallel steps; Ollama queues beyond OLLAMA_NUM_PARALLEL
max_rewrite_rounds = 2  # fact-check loop budget; bullets still unsupported after it are dropped

[cache]
# repeated model requests (same messages, model, options) are answered from this file
enabled = true
path = "cache/replies.sqlite"

[tracing]
runs_dir = "runs"

[ask]
library = "library"                 # library.toml + the PDFs; index.sqlite is kept inside it
chunk_words = 180
top_k = 4
max_loops = 2                       # retrieve -> grade -> rewrite rounds per question
num_ctx = 8192                      # context window of the ask models (short prompts; keeps both loaded)

[post.links]
# Your links, shown under every LinkedIn post (label = URL)
Website = "https://adamfodor.com"
