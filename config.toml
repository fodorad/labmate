# labmate configuration. Paths are relative to the repo root.
# LABMATE_OLLAMA_HOST overrides [ollama].host (e.g. Ollama on another machine).

[ollama]
host = "http://localhost:11434"
timeout_s = 900

[models]
# Model roles. Tags must match `ollama list`.
text = "qwen3.6:35b-mlx"
critic = "gemma4:26b-mlx"
embed = "embeddinggemma:latest"  # ask: chunk and query embeddings

# Model profiles: `labmate --profile NAME ...` (or LABMATE_PROFILE=NAME) swaps the writer and the judge.
# `make bench` compares them; sizes are what Ollama lists. This Mac has 32 GB of memory.
[profiles.current]        # 37 GB together: Ollama swaps them
text = "qwen3.6:35b-mlx"
critic = "gemma4:26b-mlx"

[profiles.gemma-26b]      # one model, 16 GB
text = "gemma4:26b-mlx"
critic = "gemma4:26b-mlx"

[profiles.qwen]           # one model, 21 GB
text = "qwen3.6:35b-mlx"
critic = "qwen3.6:35b-mlx"

[profiles.e4b]            # one small model, 6.6 GB
text = "gemma4:e4b"
critic = "gemma4:e4b"

[profiles.mixed]          # 22.6 GB together: both stay loaded
text = "gemma4:26b-mlx"
critic = "gemma4:e4b"

[profiles.reversed]       # 22.6 GB together: small writer, big judge
text = "gemma4:e4b"
critic = "gemma4:26b-mlx"

[profiles.gemma-12b]      # one model, about 8 GB
text = "gemma4:12b"
critic = "gemma4:12b"

[profiles.e2b]            # one very small model, 4.6 GB
text = "gemma4:e2b"
critic = "gemma4:e2b"

[profiles.mixed-12b]      # about 12.6 GB together
text = "gemma4:12b"
critic = "gemma4:e2b"

[profiles.gemma-phi]      # about 27 GB together: a reasoning model as the judge (no tools needed)
text = "gemma4:26b-mlx"
critic = "phi4-reasoning:plus"

[profiles.e4b-phi]        # about 17.6 GB together
text = "gemma4:e4b"
critic = "phi4-reasoning:plus"

[generation]
temperature = 0.0
seed = 42
num_ctx = 16384  # Ollama's default window would silently truncate the paper

[pipeline]
workers = 2  # concurrent calls for parallel steps; Ollama queues beyond OLLAMA_NUM_PARALLEL
max_rewrite_rounds = 2  # fact-check loop budget; bullets still unsupported after it are dropped

[cache]
# repeated model requests (same messages, model, options) are answered from this file
enabled = true
path = "cache/replies.sqlite"

[tracing]
runs_dir = "runs"

[ask]
library = "library"                 # library.toml + the PDFs; index.sqlite is kept inside it
chunk_words = 180
top_k = 6
max_loops = 2                       # retrieve -> grade -> rewrite rounds per question

[post.links]
# Your links, shown under every LinkedIn post (label = URL)
Website = "https://adamfodor.com"
