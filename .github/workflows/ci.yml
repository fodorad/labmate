name: CI

on:
  push:
    branches: [main, dev]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          sudo apt-get install -y -q graphviz
          uv sync --extra dev --locked
      - name: Lint
        run: uv run ruff check . && uv run ruff format --check .
      - name: Type-check
        run: uv run mypy paper2flow
      - name: Test (no Ollama needed; replay/mocked)
        run: uv run pytest
      - name: Docs
        run: uv run sphinx-build -W -b html docs docs/_build/html
      - name: Replay the published gallery from its cassettes (no Ollama needed)
        if: matrix.python-version == '3.13'
        run: uv run paper2flow verify
