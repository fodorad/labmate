name: CI

# Remote CI is manual-only for now; the gate is `make check` run locally.
on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          uv sync --extra dev --locked
          npx --yes @mermaid-js/mermaid-cli@12.0.0 --version
      - name: Lint
        run: uv run ruff check . && uv run ruff format --check .
      - name: Type-check
        run: uv run mypy labmate
      - name: Test (no Ollama needed; replay/mocked)
        run: uv run pytest
      - name: Docs
        run: uv run sphinx-build -W -b html docs docs/_build/html
