[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "labmate"
version = "0.0.0"
description = "A local research assistant built from agentic patterns: paper2flow and paper2post turn a paper into a fact-checked overview and a LinkedIn post (LangChain chains); ask answers questions about your research with citations (a LangGraph agent)."
readme = "README.md"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [
    { name = "Ádám Fodor", email = "fodorad201@gmail.com" },
]
# Floor = latest stable minus one (3.14 current -> 3.13). Bump when 3.15 ships.
requires-python = ">=3.13"
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: GNU Affero General Public License v3 or later (AGPLv3+)",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "httpx>=0.28",
    "jinja2>=3.1",
    "langchain-core>=1.0",
    "pydantic>=2.10",
    "pymupdf>=1.25",
    "pyyaml>=6.0",
    "rapidfuzz>=3.10",
    "typst>=0.13",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=6.0",
    "ruff>=0.8",
    "mypy>=1.13",
    "pre-commit>=4.0",
    "sphinx>=8.1",
    "furo>=2024.8",
    "myst-parser>=4.0",
    "sphinx-autodoc-typehints>=2.5",
    "types-pyyaml>=6.0",
    "labmate[ask]",
]
# The ask feature: a LangGraph agent over your research, and its live dashboard.
ask = [
    "langgraph>=1.0",
    "langgraph-checkpoint-sqlite>=2.0",
    "langchain>=1.0",
    "numpy>=2.0",
    "nicegui>=2.0",
]

[project.scripts]
labmate = "labmate.cli:main"

[project.urls]
Homepage = "https://github.com/fodorad/labmate"
Repository = "https://github.com/fodorad/labmate"
Issues = "https://github.com/fodorad/labmate/issues"

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "D"]
ignore = ["D203", "D213", "D107"]  # D107: __init__ args are documented on the class

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D"]
"docs/**" = ["D"]

[tool.ruff.lint.isort]
known-first-party = ["labmate", "tests"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.mypy]
python_version = "3.13"
warn_unused_ignores = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=labmate --cov-report=term-missing --cov-report=xml --cov-fail-under=90"
filterwarnings = [
    # PyMuPDF's SWIG bindings (1.28.2, the latest release) define types without __module__,
    # which Python 3.13 reports on import. Upstream and harmless; any other warning shows.
    'ignore:builtin type [Ss]wig\w* has no __module__ attribute:DeprecationWarning',
]

[tool.coverage.run]
source = ["labmate"]
# UI wiring only: the dashboard's logic is labmate.ask.live, which is tested, and studio.py
# only hands the tested graphs to LangGraph Studio.
omit = ["labmate/ask/dashboard.py", "labmate/ask/studio.py"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
    "^\\s*\\.\\.\\.$",
]
