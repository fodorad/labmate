default_install_hook_types: [pre-commit, commit-msg]

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-added-large-files
        args: ["--maxkb=2048"]

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.9  # keep equal to the ruff in uv.lock, so the hook and `make lint` agree
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format

  - repo: local
    hooks:
      - id: no-ai-coauthor
        name: reject AI co-author trailers
        description: This repo does not accept AI-attributed commits.
        entry: '(?i)^co-authored-by:.*(claude|anthropic|copilot|openai|chatgpt|gpt|gemini|cursor)'
        language: pygrep
        stages: [commit-msg]
