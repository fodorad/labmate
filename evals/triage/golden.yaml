interests:
  A: multimodal emotion recognition from video and audio
  B: efficient attention mechanisms for transformers
papers:
- id: '1906.00295'
  title: Multimodal Transformer for Unaligned Multimodal Language Sequences
  abstract: 'Human language is often multimodal, which comprehends a mixture of natural language, facial
    gestures, and acoustic behaviors. However, two major challenges in modeling such multimodal human
    language time-series data exist: 1) inherent data non-alignment due to variable sampling rates for
    the sequences from each modality; and 2) long-range dependencies between elements across modalities.
    In this paper, we introduce the Multimodal Transformer (MulT) to generically address the above issues
    in an end-to-end manner without explicitly aligning the data. At the heart of our model is the directional
    pairwise crossmodal attention, which attends to interactions between multimodal sequences across distinct
    time steps and latently adapt streams from one modality to another. Comprehensive experiments on both
    aligned and non-aligned multimodal time-series show that our model outperforms state-of-the-art methods
    by a large margin. In addition, empirical analysis suggests that correlated crossmodal signals are
    able to be captured by the proposed crossmodal attention mechanism in MulT.'
  expected:
    A: deep
    B: post
- id: '1704.08619'
  title: End-to-End Multimodal Emotion Recognition using Deep Neural Networks
  abstract: Automatic affect recognition is a challenging task due to the various modalities emotions
    can be expressed with. Applications can be found in many domains including multimedia retrieval and
    human computer interaction. In recent years, deep neural networks have been used with great success
    in determining emotional states. Inspired by this success, we propose an emotion recognition system
    using auditory and visual modalities. To capture the emotional content for various styles of speaking,
    robust features need to be extracted. To this purpose, we utilize a Convolutional Neural Network (CNN)
    to extract features from the speech, while for the visual modality a deep residual network (ResNet)
    of 50 layers. In addition to the importance of feature extraction, a machine learning algorithm needs
    also to be insensitive to outliers while being able to model the context. To tackle this problem,
    Long Short-Term Memory (LSTM) networks are utilized. The system is then trained in an end-to-end fashion
    where - by also taking advantage of the correlations of the each of the streams - we manage to significantly
    outperform the traditional approaches based on auditory and visual handcrafted features for the prediction
    of spontaneous and natural emotions on the RECOLA database of the AVEC 2016 research challenge on
    emotion recognition.
  expected:
    A: deep
    B: skip
- id: '2104.03502'
  title: Emotion Recognition from Speech Using Wav2vec 2.0 Embeddings
  abstract: Emotion recognition datasets are relatively small, making the use of the more sophisticated
    deep learning approaches challenging. In this work, we propose a transfer learning method for speech
    emotion recognition where features extracted from pre-trained wav2vec 2.0 models are modeled using
    simple neural networks. We propose to combine the output of several layers from the pre-trained model
    using trainable weights which are learned jointly with the downstream model. Further, we compare performance
    using two different wav2vec 2.0 models, with and without finetuning for speech recognition. We evaluate
    our proposed approaches on two standard emotion databases IEMOCAP and RAVDESS, showing superior performance
    compared to results in the literature.
  expected:
    A: post
    B: skip
- id: '2201.02184'
  title: Learning Audio-Visual Speech Representation by Masked Multimodal Cluster Prediction
  abstract: Video recordings of speech contain correlated audio and visual information, providing a strong
    signal for speech representation learning from the speaker's lip movements and the produced sound.
    We introduce Audio-Visual Hidden Unit BERT (AV-HuBERT), a self-supervised representation learning
    framework for audio-visual speech, which masks multi-stream video input and predicts automatically
    discovered and iteratively refined multimodal hidden units. AV-HuBERT learns powerful audio-visual
    speech representation benefiting both lip-reading and automatic speech recognition. On the largest
    public lip-reading benchmark LRS3 (433 hours), AV-HuBERT achieves 32.5% WER with only 30 hours of
    labeled data, outperforming the former state-of-the-art approach (33.6%) trained with a thousand times
    more transcribed video data (31K hours). The lip-reading WER is further reduced to 26.9% when using
    all 433 hours of labeled data from LRS3 and combined with self-training. Using our audio-visual representation
    on the same benchmark for audio-only speech recognition leads to a 40% relative WER reduction over
    the state-of-the-art performance (1.3% vs 2.3%). Our code and models are available at https://github.com/facebookresearch/av_hubert
  expected:
    A: post
    B: skip
- id: '2103.15691'
  title: 'ViViT: A Video Vision Transformer'
  abstract: We present pure-transformer based models for video classification, drawing upon the recent
    success of such models in image classification. Our model extracts spatio-temporal tokens from the
    input video, which are then encoded by a series of transformer layers. In order to handle the long
    sequences of tokens encountered in video, we propose several, efficient variants of our model which
    factorise the spatial- and temporal-dimensions of the input. Although transformer-based models are
    known to only be effective when large training datasets are available, we show how we can effectively
    regularise the model during training and leverage pretrained image models to be able to train on comparatively
    small datasets. We conduct thorough ablation studies, and achieve state-of-the-art results on multiple
    video classification benchmarks including Kinetics 400 and 600, Epic Kitchens, Something-Something
    v2 and Moments in Time, outperforming prior methods based on deep 3D convolutional networks. To facilitate
    further research, we release code at https://github.com/google-research/scenic/tree/main/scenic/projects/vivit
  expected:
    A: post
    B: post
- id: '2006.11477'
  title: 'wav2vec 2.0: A Framework for Self-Supervised Learning of Speech Representations'
  abstract: We show for the first time that learning powerful representations from speech audio alone
    followed by fine-tuning on transcribed speech can outperform the best semi-supervised methods while
    being conceptually simpler. wav2vec 2.0 masks the speech input in the latent space and solves a contrastive
    task defined over a quantization of the latent representations which are jointly learned. Experiments
    using all labeled data of Librispeech achieve 1.8/3.3 WER on the clean/other test sets. When lowering
    the amount of labeled data to one hour, wav2vec 2.0 outperforms the previous state of the art on the
    100 hour subset while using 100 times less labeled data. Using just ten minutes of labeled data and
    pre-training on 53k hours of unlabeled data still achieves 4.8/8.2 WER. This demonstrates the feasibility
    of speech recognition with limited amounts of labeled data.
  expected:
    A: post
    B: skip
- id: '2006.16236'
  title: 'Transformers are RNNs: Fast Autoregressive Transformers with Linear Attention'
  abstract: Transformers achieve remarkable performance in several tasks but due to their quadratic complexity,
    with respect to the input's length, they are prohibitively slow for very long sequences. To address
    this limitation, we express the self-attention as a linear dot-product of kernel feature maps and
    make use of the associativity property of matrix products to reduce the complexity from $\mathcal{O}\left(N^2\right)$
    to $\mathcal{O}\left(N\right)$, where $N$ is the sequence length. We show that this formulation permits
    an iterative implementation that dramatically accelerates autoregressive transformers and reveals
    their relationship to recurrent neural networks. Our linear transformers achieve similar performance
    to vanilla transformers and they are up to 4000x faster on autoregressive prediction of very long
    sequences.
  expected:
    A: skip
    B: deep
- id: '2009.14794'
  title: Rethinking Attention with Performers
  abstract: 'We introduce Performers, Transformer architectures which can estimate regular (softmax) full-rank-attention
    Transformers with provable accuracy, but using only linear (as opposed to quadratic) space and time
    complexity, without relying on any priors such as sparsity or low-rankness. To approximate softmax
    attention-kernels, Performers use a novel Fast Attention Via positive Orthogonal Random features approach
    (FAVOR+), which may be of independent interest for scalable kernel methods. FAVOR+ can be also used
    to efficiently model kernelizable attention mechanisms beyond softmax. This representational power
    is crucial to accurately compare softmax with other kernels for the first time on large-scale tasks,
    beyond the reach of regular Transformers, and investigate optimal attention-kernels. Performers are
    linear architectures fully compatible with regular Transformers and with strong theoretical guarantees:
    unbiased or nearly-unbiased estimation of the attention matrix, uniform convergence and low estimation
    variance. We tested Performers on a rich set of tasks stretching from pixel-prediction through text
    models to protein sequence modeling. We demonstrate competitive results with other examined efficient
    sparse and dense attention methods, showcasing effectiveness of the novel attention-learning paradigm
    leveraged by Performers.'
  expected:
    A: skip
    B: deep
- id: '2004.05150'
  title: 'Longformer: The Long-Document Transformer'
  abstract: Transformer-based models are unable to process long sequences due to their self-attention
    operation, which scales quadratically with the sequence length. To address this limitation, we introduce
    the Longformer with an attention mechanism that scales linearly with sequence length, making it easy
    to process documents of thousands of tokens or longer. Longformer's attention mechanism is a drop-in
    replacement for the standard self-attention and combines a local windowed attention with a task motivated
    global attention. Following prior work on long-sequence transformers, we evaluate Longformer on character-level
    language modeling and achieve state-of-the-art results on text8 and enwik8. In contrast to most prior
    work, we also pretrain Longformer and finetune it on a variety of downstream tasks. Our pretrained
    Longformer consistently outperforms RoBERTa on long document tasks and sets new state-of-the-art results
    on WikiHop and TriviaQA. We finally introduce the Longformer-Encoder-Decoder (LED), a Longformer variant
    for supporting long document generative sequence-to-sequence tasks, and demonstrate its effectiveness
    on the arXiv summarization dataset.
  expected:
    A: skip
    B: deep
- id: '2205.14135'
  title: 'FlashAttention: Fast and Memory-Efficient Exact Attention with IO-Awareness'
  abstract: 'Transformers are slow and memory-hungry on long sequences, since the time and memory complexity
    of self-attention are quadratic in sequence length. Approximate attention methods have attempted to
    address this problem by trading off model quality to reduce the compute complexity, but often do not
    achieve wall-clock speedup. We argue that a missing principle is making attention algorithms IO-aware
    -- accounting for reads and writes between levels of GPU memory. We propose FlashAttention, an IO-aware
    exact attention algorithm that uses tiling to reduce the number of memory reads/writes between GPU
    high bandwidth memory (HBM) and GPU on-chip SRAM. We analyze the IO complexity of FlashAttention,
    showing that it requires fewer HBM accesses than standard attention, and is optimal for a range of
    SRAM sizes. We also extend FlashAttention to block-sparse attention, yielding an approximate attention
    algorithm that is faster than any existing approximate attention method. FlashAttention trains Transformers
    faster than existing baselines: 15% end-to-end wall-clock speedup on BERT-large (seq. length 512)
    compared to the MLPerf 1.1 training speed record, 3$\times$ speedup on GPT-2 (seq. length 1K), and
    2.4$\times$ speedup on long-range arena (seq. length 1K-4K). FlashAttention and block-sparse FlashAttention
    enable longer context in Transformers, yielding higher quality models (0.7 better perplexity on GPT-2
    and 6.4 points of lift on long-document classification) and entirely new capabilities: the first Transformers
    to achieve better-than-chance performance on the Path-X challenge (seq. length 16K, 61.4% accuracy)
    and Path-256 (seq. length 64K, 63.1% accuracy).'
  expected:
    A: skip
    B: deep
- id: '2001.04451'
  title: 'Reformer: The Efficient Transformer'
  abstract: Large Transformer models routinely achieve state-of-the-art results on a number of tasks but
    training these models can be prohibitively costly, especially on long sequences. We introduce two
    techniques to improve the efficiency of Transformers. For one, we replace dot-product attention by
    one that uses locality-sensitive hashing, changing its complexity from O($L^2$) to O($L\log L$), where
    $L$ is the length of the sequence. Furthermore, we use reversible residual layers instead of the standard
    residuals, which allows storing activations only once in the training process instead of $N$ times,
    where $N$ is the number of layers. The resulting model, the Reformer, performs on par with Transformer
    models while being much more memory-efficient and much faster on long sequences.
  expected:
    A: skip
    B: deep
- id: '2312.00752'
  title: 'Mamba: Linear-Time Sequence Modeling with Selective State Spaces'
  abstract: Foundation models, now powering most of the exciting applications in deep learning, are almost
    universally based on the Transformer architecture and its core attention module. Many subquadratic-time
    architectures such as linear attention, gated convolution and recurrent models, and structured state
    space models (SSMs) have been developed to address Transformers' computational inefficiency on long
    sequences, but they have not performed as well as attention on important modalities such as language.
    We identify that a key weakness of such models is their inability to perform content-based reasoning,
    and make several improvements. First, simply letting the SSM parameters be functions of the input
    addresses their weakness with discrete modalities, allowing the model to selectively propagate or
    forget information along the sequence length dimension depending on the current token. Second, even
    though this change prevents the use of efficient convolutions, we design a hardware-aware parallel
    algorithm in recurrent mode. We integrate these selective SSMs into a simplified end-to-end neural
    network architecture without attention or even MLP blocks (Mamba). Mamba enjoys fast inference (5$\times$
    higher throughput than Transformers) and linear scaling in sequence length, and its performance improves
    on real data up to million-length sequences. As a general sequence model backbone, Mamba achieves
    state-of-the-art performance across several modalities such as language, audio, and genomics. On language
    modeling, our Mamba-3B model outperforms Transformers of the same size and matches Transformers twice
    its size, both in pretraining and downstream evaluation.
  expected:
    A: skip
    B: post
- id: '2103.14030'
  title: 'Swin Transformer: Hierarchical Vision Transformer using Shifted Windows'
  abstract: This paper presents a new vision Transformer, called Swin Transformer, that capably serves
    as a general-purpose backbone for computer vision. Challenges in adapting Transformer from language
    to vision arise from differences between the two domains, such as large variations in the scale of
    visual entities and the high resolution of pixels in images compared to words in text. To address
    these differences, we propose a hierarchical Transformer whose representation is computed with \textbf{S}hifted
    \textbf{win}dows. The shifted windowing scheme brings greater efficiency by limiting self-attention
    computation to non-overlapping local windows while also allowing for cross-window connection. This
    hierarchical architecture has the flexibility to model at various scales and has linear computational
    complexity with respect to image size. These qualities of Swin Transformer make it compatible with
    a broad range of vision tasks, including image classification (87.3 top-1 accuracy on ImageNet-1K)
    and dense prediction tasks such as object detection (58.7 box AP and 51.1 mask AP on COCO test-dev)
    and semantic segmentation (53.5 mIoU on ADE20K val). Its performance surpasses the previous state-of-the-art
    by a large margin of +2.7 box AP and +2.6 mask AP on COCO, and +3.2 mIoU on ADE20K, demonstrating
    the potential of Transformer-based models as vision backbones. The hierarchical design and the shifted
    window approach also prove beneficial for all-MLP architectures. The code and models are publicly
    available at~\url{https://github.com/microsoft/Swin-Transformer}.
  expected:
    A: skip
    B: post
- id: '1706.03762'
  title: Attention Is All You Need
  abstract: The dominant sequence transduction models are based on complex recurrent or convolutional
    neural networks in an encoder-decoder configuration. The best performing models also connect the encoder
    and decoder through an attention mechanism. We propose a new simple network architecture, the Transformer,
    based solely on attention mechanisms, dispensing with recurrence and convolutions entirely. Experiments
    on two machine translation tasks show these models to be superior in quality while being more parallelizable
    and requiring significantly less time to train. Our model achieves 28.4 BLEU on the WMT 2014 English-to-German
    translation task, improving over the existing best results, including ensembles by over 2 BLEU. On
    the WMT 2014 English-to-French translation task, our model establishes a new single-model state-of-the-art
    BLEU score of 41.8 after training for 3.5 days on eight GPUs, a small fraction of the training costs
    of the best models from the literature. We show that the Transformer generalizes well to other tasks
    by applying it successfully to English constituency parsing both with large and limited training data.
  expected:
    A: skip
    B: post
- id: '1512.03385'
  title: Deep Residual Learning for Image Recognition
  abstract: Deeper neural networks are more difficult to train. We present a residual learning framework
    to ease the training of networks that are substantially deeper than those used previously. We explicitly
    reformulate the layers as learning residual functions with reference to the layer inputs, instead
    of learning unreferenced functions. We provide comprehensive empirical evidence showing that these
    residual networks are easier to optimize, and can gain accuracy from considerably increased depth.
    On the ImageNet dataset we evaluate residual nets with a depth of up to 152 layers---8x deeper than
    VGG nets but still having lower complexity. An ensemble of these residual nets achieves 3.57% error
    on the ImageNet test set. This result won the 1st place on the ILSVRC 2015 classification task. We
    also present analysis on CIFAR-10 with 100 and 1000 layers. The depth of representations is of central
    importance for many visual recognition tasks. Solely due to our extremely deep representations, we
    obtain a 28% relative improvement on the COCO object detection dataset. Deep residual nets are foundations
    of our submissions to ILSVRC & COCO 2015 competitions, where we also won the 1st places on the tasks
    of ImageNet detection, ImageNet localization, COCO detection, and COCO segmentation.
  expected:
    A: skip
    B: skip
- id: '1810.04805'
  title: 'BERT: Pre-training of Deep Bidirectional Transformers for Language Understanding'
  abstract: We introduce a new language representation model called BERT, which stands for Bidirectional
    Encoder Representations from Transformers. Unlike recent language representation models, BERT is designed
    to pre-train deep bidirectional representations from unlabeled text by jointly conditioning on both
    left and right context in all layers. As a result, the pre-trained BERT model can be fine-tuned with
    just one additional output layer to create state-of-the-art models for a wide range of tasks, such
    as question answering and language inference, without substantial task-specific architecture modifications.
    BERT is conceptually simple and empirically powerful. It obtains new state-of-the-art results on eleven
    natural language processing tasks, including pushing the GLUE score to 80.5% (7.7% point absolute
    improvement), MultiNLI accuracy to 86.7% (4.6% absolute improvement), SQuAD v1.1 question answering
    Test F1 to 93.2 (1.5 point absolute improvement) and SQuAD v2.0 Test F1 to 83.1 (5.1 point absolute
    improvement).
  expected:
    A: skip
    B: skip
- id: '1704.04861'
  title: 'MobileNets: Efficient Convolutional Neural Networks for Mobile Vision Applications'
  abstract: We present a class of efficient models called MobileNets for mobile and embedded vision applications.
    MobileNets are based on a streamlined architecture that uses depth-wise separable convolutions to
    build light weight deep neural networks. We introduce two simple global hyper-parameters that efficiently
    trade off between latency and accuracy. These hyper-parameters allow the model builder to choose the
    right sized model for their application based on the constraints of the problem. We present extensive
    experiments on resource and accuracy tradeoffs and show strong performance compared to other popular
    models on ImageNet classification. We then demonstrate the effectiveness of MobileNets across a wide
    range of applications and use cases including object detection, finegrain classification, face attributes
    and large scale geo-localization.
  expected:
    A: skip
    B: skip
- id: '2005.14165'
  title: Language Models are Few-Shot Learners
  abstract: Recent work has demonstrated substantial gains on many NLP tasks and benchmarks by pre-training
    on a large corpus of text followed by fine-tuning on a specific task. While typically task-agnostic
    in architecture, this method still requires task-specific fine-tuning datasets of thousands or tens
    of thousands of examples. By contrast, humans can generally perform a new language task from only
    a few examples or from simple instructions - something which current NLP systems still largely struggle
    to do. Here we show that scaling up language models greatly improves task-agnostic, few-shot performance,
    sometimes even reaching competitiveness with prior state-of-the-art fine-tuning approaches. Specifically,
    we train GPT-3, an autoregressive language model with 175 billion parameters, 10x more than any previous
    non-sparse language model, and test its performance in the few-shot setting. For all tasks, GPT-3
    is applied without any gradient updates or fine-tuning, with tasks and few-shot demonstrations specified
    purely via text interaction with the model. GPT-3 achieves strong performance on many NLP datasets,
    including translation, question-answering, and cloze tasks, as well as several tasks that require
    on-the-fly reasoning or domain adaptation, such as unscrambling words, using a novel word in a sentence,
    or performing 3-digit arithmetic. At the same time, we also identify some datasets where GPT-3's few-shot
    learning still struggles, as well as some datasets where GPT-3 faces methodological issues related
    to training on large web corpora. Finally, we find that GPT-3 can generate samples of news articles
    which human evaluators have difficulty distinguishing from articles written by humans. We discuss
    broader societal impacts of this finding and of GPT-3 in general.
  expected:
    A: skip
    B: skip
